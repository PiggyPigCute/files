<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>files.ernestie.fr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet: #6b3fa0;
    --violet-dark: #4d2c76;
    --violet-soft: #efe6f7;
    --yellow: #f2c14e;
    --ink: #1c1721;
    --ink-soft: #4a4256;
    --bg: #f7f4fb;
    --card: #ffffff;
    --danger: #d1495b;
    --green: #2f9e6e;
    --shadow: 0 4px 16px rgba(43, 20, 70, 0.1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
  }
  .hidden { display: none !important; }

  /* --- Login --- */
  #login-view {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(160deg, var(--violet-dark), var(--violet) 60%);
  }
  .login-card {
    background: var(--card);
    border-radius: 18px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    text-align: center;
  }
  .lock-badge {
    width: 52px; height: 52px;
    background: var(--violet-soft);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
    font-size: 24px;
  }
  .login-card h1 { font-size: 20px; margin: 0 0 4px; }
  .login-card p.sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px; }
  input[type="password"] {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 2px solid #e2d9ee; font-size: 15px;
    font-family: 'JetBrains Mono', monospace; text-align: center; letter-spacing: 2px;
  }
  input[type="password"]:focus { outline: none; border-color: var(--violet); }
  .stay-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 16px 0; font-size: 13px; color: var(--ink-soft); }
  button.primary {
    width: 100%; background: var(--violet); color: #fff; border: none;
    padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button.primary:hover { background: var(--violet-dark); }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }
  .error-msg.visible { display: block; }

  /* --- App --- */
  #app-view { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  header.app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  header.app-header h1 { font-size: 20px; margin: 0; color: var(--violet-dark); }
  header.app-header h1 span { color: var(--yellow); }
  #logout-btn {
    background: none; border: 1px solid #ddd0ea; color: var(--ink-soft);
    font-size: 12px; padding: 7px 12px; border-radius: 999px; cursor: pointer;
  }

  .search-bar {
    width: 100%; padding: 12px 16px; border-radius: 12px;
    border: 2px solid #e2d9ee; font-size: 14px; margin-bottom: 14px; background: var(--card);
  }
  .search-bar:focus { outline: none; border-color: var(--violet); }

  .action-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .action-row button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; padding: 10px 14px; border-radius: 10px;
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  #upload-toggle { background: var(--yellow); color: var(--ink); }
  #folder-toggle { background: var(--violet-soft); color: var(--violet-dark); }

  .panel {
    background: var(--card); border-radius: 14px; padding: 18px;
    margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .panel label {
    display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--ink-soft); margin: 12px 0 6px;
  }
  .panel label:first-child { margin-top: 0; }
  .panel input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 2px solid #e2d9ee; font-family: 'JetBrains Mono', monospace; font-size: 14px;
  }
  .panel input[type="file"] { width: 100%; font-size: 13px; }
  .panel .folder-hint { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .btn-row button { flex: 1; }
  button.secondary {
    background: transparent; border: 2px solid #ddd0ea; color: var(--ink-soft);
    padding: 10px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;
  }

  /* Breadcrumb */
  .breadcrumb {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
    font-size: 13px; color: var(--ink-soft); margin-bottom: 12px;
  }
  .breadcrumb button {
    background: none; border: none; color: var(--violet); font-weight: 600;
    font-size: 13px; cursor: pointer; padding: 2px 4px;
  }
  .breadcrumb button:last-child { color: var(--ink-soft); cursor: default; }
  .breadcrumb .sep { opacity: 0.5; }

  .file-list { display: flex; flex-direction: column; gap: 8px; }

  .folder-row {
    background: var(--violet-soft);
    border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; border: none; width: 100%; text-align: left; font-family: inherit;
  }
  .folder-row .folder-icon { font-size: 18px; }
  .folder-row .folder-name { font-weight: 700; color: var(--violet-dark); font-size: 14px; flex: 1; }
  .folder-row .delete-btn { background: none; border: none; color: var(--violet-dark); opacity: 0.5; font-size: 15px; cursor: pointer; padding: 4px; }
  .folder-row .delete-btn:hover { opacity: 1; color: var(--danger); }

  .file-row {
    background: var(--card); border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);
    text-decoration: none; color: inherit;
  }
  .file-icon {
    width: 38px; height: 38px; border-radius: 9px;
    background: var(--violet-soft); color: var(--violet-dark);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
  .file-meta { flex: 1; min-width: 0; }
  .file-id-line {
    font-weight: 700; font-size: 15px; font-family: 'JetBrains Mono', monospace;
    color: var(--violet-dark);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: block;
  }
  .file-sub {
    font-size: 12px; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 2px;
  }
  .file-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    background: none; border: none; font-size: 15px; cursor: pointer; padding: 6px;
    color: var(--ink-soft);
  }
  .icon-btn.public-on { color: var(--green); }
  .icon-btn.delete-btn:hover { color: var(--danger); }

  .empty-state { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 40px 20px; }
</style>
</head>
<body>

<!-- Écran de connexion -->
<div id="login-view">
  <div class="login-card">
    <div class="lock-badge">🔒</div>
    <h1>files.ernestie.fr</h1>
    <p class="sub">Espace privé — entre le mot de passe</p>
    <form id="login-form">
      <input type="password" id="password" placeholder="••••••••" required autofocus>
      <div class="stay-row">
        <input type="checkbox" id="stay-connected" checked>
        <label for="stay-connected">Rester connecté</label>
      </div>
      <button type="submit" class="primary" id="login-btn">Se connecter</button>
      <p class="error-msg" id="login-error"></p>
    </form>
  </div>
</div>

<!-- Application (visible après connexion) -->
<div id="app-view" class="hidden">
  <header class="app-header">
    <h1>files<span>.</span>ernestie<span>.</span>fr</h1>
    <button id="logout-btn">Déconnexion</button>
  </header>

  <input type="text" id="search" class="search-bar" placeholder="Rechercher un fichier (nom ou ID)...">

  <div class="action-row">
    <button id="upload-toggle">+ Fichier</button>
    <button id="folder-toggle">+ Dossier</button>
  </div>

  <div id="upload-panel" class="panel hidden">
    <form id="upload-form">
      <label for="file-id">ID du document</label>
      <input type="text" id="file-id" placeholder="ex : releve-cesu-juin" required pattern="[a-zA-Z0-9_-]+">
      <label for="file-input">Fichier</label>
      <input type="file" id="file-input" required>
      <p class="folder-hint" id="upload-folder-hint"></p>
      <p class="error-msg" id="upload-error"></p>
      <div class="btn-row">
        <button type="button" class="secondary" id="cancel-upload">Annuler</button>
        <button type="submit" class="primary" id="upload-submit">Envoyer</button>
      </div>
    </form>
  </div>

  <div id="folder-panel" class="panel hidden">
    <form id="folder-form">
      <label for="folder-name">Nom du dossier</label>
      <input type="text" id="folder-name" placeholder="ex : administratif" required>
      <p class="folder-hint" id="folder-create-hint"></p>
      <p class="error-msg" id="folder-error"></p>
      <div class="btn-row">
        <button type="button" class="secondary" id="cancel-folder">Annuler</button>
        <button type="submit" class="primary" id="folder-submit">Créer</button>
      </div>
    </form>
  </div>

  <div class="breadcrumb" id="breadcrumb"></div>

  <div id="file-list" class="file-list"></div>
  <p id="empty-state" class="empty-state hidden">Ce dossier est vide.</p>
</div>

<script>
let allFiles = [];
let allFolders = [];
let currentFolder = new URLSearchParams(window.location.search).get('folder') || '';

function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} o`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} Ko`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} Mo`;
}
function formatDate(iso) {
  return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
}
function iconFor(mimetype) {
  if (!mimetype) return '📄';
  if (mimetype.includes('pdf')) return '📕';
  if (mimetype.startsWith('image/')) return '🖼️';
  if (mimetype.includes('zip') || mimetype.includes('compressed')) return '🗜️';
  if (mimetype.startsWith('audio/')) return '🎵';
  if (mimetype.startsWith('video/')) return '🎬';
  return '📄';
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function goToFolder(path) {
  currentFolder = path;
  const url = new URL(window.location);
  if (path) url.searchParams.set('folder', path); else url.searchParams.delete('folder');
  history.replaceState({}, '', url);
  document.getElementById('search').value = '';
  render();
}

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  const segments = currentFolder ? currentFolder.split('/') : [];
  let acc = '';
  let html = `<button onclick="goToFolder('')">📁 Racine</button>`;
  segments.forEach((seg, i) => {
    acc = acc ? `${acc}/${seg}` : seg;
    const path = acc;
    html += `<span class="sep">/</span><button onclick="goToFolder('${escapeHtml(path)}')">${escapeHtml(seg)}</button>`;
  });
  el.innerHTML = html;
}

async function handleDeleteFolder(e, path) {
  e.preventDefault();
  e.stopPropagation();
  if (!confirm(`Supprimer le dossier "${path}" ? (doit être vide)`)) return;
  const res = await fetch(`/api/folders?path=${encodeURIComponent(path)}`, { method: 'DELETE' });
  const data = await res.json().catch(() => ({}));
  if (res.ok) {
    await loadAll();
  } else {
    alert(data.error || 'Impossible de supprimer ce dossier');
  }
}

async function handleDeleteFile(e, id) {
  e.preventDefault();
  e.stopPropagation();
  if (!confirm(`Supprimer le fichier "${id}" ?`)) return;
  const res = await fetch(`/api/files/${encodeURIComponent(id)}`, { method: 'DELETE' });
  if (res.ok) { await loadAll(); } else { alert('Erreur lors de la suppression'); }
}

async function handleTogglePublic(e, id, current) {
  e.preventDefault();
  e.stopPropagation();
  const res = await fetch(`/api/files/${encodeURIComponent(id)}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ public: !current })
  });
  if (res.ok) { await loadAll(); } else { alert('Erreur lors du changement de statut'); }
}

function render() {
  renderBreadcrumb();
  const listEl = document.getElementById('file-list');
  const emptyEl = document.getElementById('empty-state');
  const q = document.getElementById('search').value.trim().toLowerCase();

  let html = '';

  if (!q) {
    // Mode navigation : sous-dossiers du dossier courant
    const subfolders = allFolders.filter(f => {
      if (currentFolder) {
        if (!f.startsWith(currentFolder + '/')) return false;
        const rest = f.slice(currentFolder.length + 1);
        return !rest.includes('/');
      }
      return !f.includes('/');
    });
    html += subfolders.map(f => {
      const label = currentFolder ? f.slice(currentFolder.length + 1) : f;
      return `
        <button class="folder-row" onclick="goToFolder('${escapeHtml(f)}')">
          <span class="folder-icon">📁</span>
          <span class="folder-name">${escapeHtml(label)}</span>
          <span class="delete-btn" onclick="handleDeleteFolder(event, '${escapeHtml(f)}')">✕</span>
        </button>
      `;
    }).join('');
  }

  const filesToShow = q
    ? allFiles.filter(f => f.originalName.toLowerCase().includes(q) || f.id.toLowerCase().includes(q))
    : allFiles.filter(f => (f.folder || '') === currentFolder);

  html += filesToShow.map(f => `
    <a class="file-row" href="/${encodeURIComponent(f.id)}" target="_blank" rel="noopener">
      <div class="file-icon">${iconFor(f.mimetype)}</div>
      <div class="file-meta">
        <span class="file-id-line">/${escapeHtml(f.id)}</span>
        <div class="file-sub">${escapeHtml(f.originalName)} · ${formatSize(f.size)} · ${formatDate(f.uploadedAt)}${q && f.folder ? ' · 📁 ' + escapeHtml(f.folder) : ''}</div>
      </div>
      <div class="file-actions">
        <button class="icon-btn ${f.public ? 'public-on' : ''}" title="${f.public ? 'Public (cliquer pour rendre privé)' : 'Privé (cliquer pour rendre public)'}" onclick="handleTogglePublic(event, '${escapeHtml(f.id)}', ${f.public})">${f.public ? '🌐' : '🔒'}</button>
        <button class="icon-btn delete-btn" title="Supprimer" onclick="handleDeleteFile(event, '${escapeHtml(f.id)}')">✕</button>
      </div>
    </a>
  `).join('');

  listEl.innerHTML = html;
  emptyEl.classList.toggle('hidden', html !== '');
}

document.getElementById('search').addEventListener('input', render);

async function loadAll() {
  const [filesRes, foldersRes] = await Promise.all([fetch('/api/files'), fetch('/api/folders')]);
  allFiles = await filesRes.json();
  allFolders = await foldersRes.json();
  render();
}

// --- Panneaux upload / dossier ---
const uploadPanel = document.getElementById('upload-panel');
const folderPanel = document.getElementById('folder-panel');

document.getElementById('upload-toggle').addEventListener('click', () => {
  folderPanel.classList.add('hidden');
  uploadPanel.classList.toggle('hidden');
  document.getElementById('upload-folder-hint').textContent = currentFolder
    ? `Sera ajouté dans : 📁 ${currentFolder}` : 'Sera ajouté à la racine';
});
document.getElementById('cancel-upload').addEventListener('click', () => {
  uploadPanel.classList.add('hidden');
  document.getElementById('upload-form').reset();
});

document.getElementById('folder-toggle').addEventListener('click', () => {
  uploadPanel.classList.add('hidden');
  folderPanel.classList.toggle('hidden');
  document.getElementById('folder-create-hint').textContent = currentFolder
    ? `Sera créé dans : 📁 ${currentFolder}` : 'Sera créé à la racine';
});
document.getElementById('cancel-folder').addEventListener('click', () => {
  folderPanel.classList.add('hidden');
  document.getElementById('folder-form').reset();
});

document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById('upload-submit');
  const errorEl = document.getElementById('upload-error');
  errorEl.classList.remove('visible');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Envoi...';

  const formData = new FormData();
  formData.append('id', document.getElementById('file-id').value.trim());
  formData.append('folder', currentFolder);
  formData.append('file', document.getElementById('file-input').files[0]);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur lors de l\'envoi');
    document.getElementById('upload-form').reset();
    uploadPanel.classList.add('hidden');
    await loadAll();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('visible');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Envoyer';
  }
});

document.getElementById('folder-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById('folder-submit');
  const errorEl = document.getElementById('folder-error');
  errorEl.classList.remove('visible');
  submitBtn.disabled = true;

  const name = document.getElementById('folder-name').value.trim();
  const fullPath = currentFolder ? `${currentFolder}/${name}` : name;

  try {
    const res = await fetch('/api/folders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: fullPath })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur lors de la création');
    document.getElementById('folder-form').reset();
    folderPanel.classList.add('hidden');
    await loadAll();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('visible');
  } finally {
    submitBtn.disabled = false;
  }
});

// --- Login ---
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errorEl = document.getElementById('login-error');
  errorEl.classList.remove('visible');
  btn.disabled = true;
  btn.textContent = 'Connexion...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        password: document.getElementById('password').value,
        stayConnected: document.getElementById('stay-connected').checked
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur de connexion');

    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    if (redirect) {
      window.location.href = redirect;
    } else {
      showApp();
    }
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/';
});

function showApp() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('app-view').classList.remove('hidden');
  loadAll();
}
function showLogin() {
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('app-view').classList.add('hidden');
}

(async () => {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (data.loggedIn) { showApp(); } else { showLogin(); }
})();
</script>
</body>
</html>
